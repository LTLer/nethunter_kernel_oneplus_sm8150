name: build-nethunter-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zip unzip wget curl \
            python3 gcc-aarch64-linux-gnu device-tree-compiler

      - name: Download clang r563880c
        run: |
          curl -L --retry 3 -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f8439f0628d799092dd07df440a6334cab28939c/clang-r563880c.tar.gz"
          mkdir -p toolchains
          tar -xzf clang.tar.gz -C toolchains
          ./toolchains/bin/clang --version

      - name: Fix qcacld symlinks
        run: |
          cd drivers/staging/qcacld-3.0
          for d in $(find . -type d -name inc); do
            for f in "$d"/*.h; do
              if [ -f "$f" ]; then
                b=$(basename "$f")
                if [ ! -e "inc/$b" ]; then
                  ln -s "../${d#./}/$b" "inc/$b" || true
                fi
              fi
            done
          done
          ls -l inc/wma_frame_inject.h inc/wlan_hdd_frame_inject.h

      - name: Enable qcacld frame injection
        run: |
          python3 - <<'PY'
          p = "nethunter/Kconfig"
          s = open(p).read()
          if "FEATURE_FRAME_INJECTION_SUPPORT" not in s:
              block = ("\nconfig FEATURE_FRAME_INJECTION_SUPPORT\n"
                       "\tbool \"qcacld-3.0 frame injection / internal monitor\"\n"
                       "\tdefault y\n"
                       "\thelp\n"
                       "\t  Enable NetHunter qcacld frame injection support.\n\n")
              i = s.rfind("endmenu")
              s = s[:i] + block + s[i:]
              open(p, "w").write(s)
          print("Kconfig patched")
          PY
          echo "CONFIG_FEATURE_FRAME_INJECTION_SUPPORT=y" >> nethunter/nethunter_defconfig
          grep -n FEATURE_FRAME_INJECTION nethunter/Kconfig nethunter/nethunter_defconfig

      - name: Configure kernel
        run: |
          set -e
          sed -i '/select MODVERSIONS/d' nethunter/Kconfig
          mkdir -p out
          KCONFIG_CONFIG=out/.config scripts/kconfig/merge_config.sh -m -r \
            arch/arm64/configs/vendor/sm8150-perf_defconfig \
            arch/arm64/configs/vendor/oplus.config \
            nethunter/nethunter_defconfig
          {
            echo "CONFIG_MODULE_FORCE_LOAD=y"
            echo "# CONFIG_MODVERSIONS is not set"
          } >> out/.config
          export PATH=$PWD/toolchains/bin:$PATH
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 olddefconfig
          echo "----- key config -----"
          grep -E 'MODVERSIONS|MODULE_FORCE_LOAD|MODULE_SIG|^CONFIG_LOCALVERSION' out/.config || true

      - name: Build Image.gz
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          set +e
          make -j$(nproc) ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 AS=llvm-as DTC_EXT=$PWD/dtc Image.gz \
            2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "================ ERROR SUMMARY ================"
            grep -nE "fatal error|error:|Error 1" build.log | head -20
            echo "================ CONTEXT ================"
            first=$(grep -n -m1 "Error 1" build.log | cut -d: -f1)
            if [ -n "$first" ]; then
              start=$((first-30))
              [ "$start" -lt 1 ] && start=1
              sed -n "${start},$((first+5))p" build.log
            fi
          fi
          exit "$status"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-kernel-image
          path: out/arch/arm64/boot/Image.gz
          if-no-files-found: error
