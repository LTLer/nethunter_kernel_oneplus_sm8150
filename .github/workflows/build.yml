name: build-nethunter-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zip unzip wget curl \
            python3 gcc-aarch64-linux-gnu device-tree-compiler

      - name: Download clang r563880c
        run: |
          curl -L --retry 3 -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f8439f0628d799092dd07df440a6334cab28939c/clang-r563880c.tar.gz"
          mkdir -p toolchains
          tar -xzf clang.tar.gz -C toolchains
          ./toolchains/bin/clang --version

      - name: Fix qcacld symlinks
        run: |
          cd drivers/staging/qcacld-3.0
          for d in $(find . -type d -name inc); do
            for f in "$d"/*.h; do
              if [ -f "$f" ]; then
                b=$(basename "$f")
                if [ ! -e "inc/$b" ]; then
                  ln -s "../${d#./}/$b" "inc/$b" || true
                fi
              fi
            done
          done
          ls -l inc/wma_frame_inject.h inc/wlan_hdd_frame_inject.h

      - name: Enable qcacld frame injection
        run: |
          python3 - <<'PY'
          p = "nethunter/Kconfig"
          s = open(p).read()
          if "FEATURE_FRAME_INJECTION_SUPPORT" not in s:
              block = ("\nconfig FEATURE_FRAME_INJECTION_SUPPORT\n"
                       "\tbool \"qcacld-3.0 frame injection / internal monitor\"\n"
                       "\tdefault y\n"
                       "\thelp\n"
                       "\t  Enable NetHunter qcacld frame injection support.\n\n")
              i = s.rfind("endmenu")
              s = s[:i] + block + s[i:]
              open(p, "w").write(s)
          print("Kconfig patched")
          PY
          echo "CONFIG_FEATURE_FRAME_INJECTION_SUPPORT=y" >> nethunter/nethunter_defconfig
          grep -n FEATURE_FRAME_INJECTION nethunter/Kconfig nethunter/nethunter_defconfig

      - name: Configure kernel
        run: |
          set -e
          sed -i '/select MODVERSIONS/d' nethunter/Kconfig
          mkdir -p out
          KCONFIG_CONFIG=out/.config scripts/kconfig/merge_config.sh -m -r \
            arch/arm64/configs/vendor/sm8150-perf_defconfig \
            arch/arm64/configs/vendor/oplus.config \
            nethunter/nethunter_defconfig
          {
            echo "CONFIG_MODULE_FORCE_LOAD=y"
            echo "# CONFIG_MODVERSIONS is not set"
            echo "CONFIG_RD_LZ4=y"
            echo "CONFIG_RD_XZ=y"
            echo "CONFIG_RD_LZO=y"
            echo "CONFIG_INITRAMFS_IGNORE_SKIP_FLAG=y"
          } >> out/.config
          export PATH=$PWD/toolchains/bin:$PATH
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 olddefconfig
          echo "----- key config -----"
          grep -E 'MODVERSIONS|MODULE_FORCE_LOAD|MODULE_SIG|RD_LZ4|RD_XZ|RD_LZO|INITRAMFS_IGNORE_SKIP|^CONFIG_LOCALVERSION' out/.config || true
          echo "----- boot-critical guard -----"
          if ! grep -q '^CONFIG_RD_LZ4=y' out/.config; then
            echo "FATAL: CONFIG_RD_LZ4 is not enabled - LineageOS lz4 ramdisk cannot be unpacked, aborting"
            exit 1
          fi
          echo "CONFIG_RD_LZ4=y confirmed, keep building"

      - name: Build Image.gz
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          set +e
          make -j$(nproc) ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 AS=llvm-as DTC_EXT=$PWD/dtc Image.gz \
            2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "================ ERROR SUMMARY ================"
            grep -nE "fatal error|error:|Error 1" build.log | head -20
            echo "================ CONTEXT ================"
            first=$(grep -n -m1 "Error 1" build.log | cut -d: -f1)
            if [ -n "$first" ]; then
              start=$((first-30))
              [ "$start" -lt 1 ] && start=1
              sed -n "${start},$((first+5))p" build.log
            fi
          fi
          exit "$status"

      - name: Build modules
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          set +e
          make -j$(nproc) ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 AS=llvm-as DTC_EXT=$PWD/dtc modules \
            2>&1 | tee modules.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "================ MODULES ERROR ================"
            grep -nE "fatal error|error:|Error 1" modules.log | head -20
            echo "================ CONTEXT ================"
            first=$(grep -n -m1 "Error 1" modules.log | cut -d: -f1)
            if [ -n "$first" ]; then
              start=$((first-30))
              [ "$start" -lt 1 ] && start=1
              sed -n "${start},$((first+5))p" modules.log
            fi
          fi
          exit "$status"

      - name: Install modules
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          KVER=$(cat out/include/config/kernel.release)
          echo "KERNELRELEASE=$KVER"
          make ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 AS=llvm-as DTC_EXT=$PWD/dtc \
            INSTALL_MOD_PATH=$PWD/modules_out INSTALL_MOD_STRIP=1 DEPMOD=/bin/true \
            modules_install
          find modules_out -name '*.ko' | sort | tee modules.lst
          mkdir -p "modules_pkg/lib/modules/$KVER"
          find modules_out -name '*.ko' -exec cp {} "modules_pkg/lib/modules/$KVER/" \;
          (cd modules_pkg && zip -r9 "../NetHunter-modules-$KVER.zip" .)
          ls -lh NetHunter-modules-*.zip

      - name: Package AnyKernel3
        run: |
          KVER=$(cat out/include/config/kernel.release)
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git
          cp out/arch/arm64/boot/Image.gz ak3/Image.gz
          mkdir -p "ak3/modules/vendor/lib/modules/$KVER"
          find modules_out -name '*.ko' -exec cp {} "ak3/modules/vendor/lib/modules/$KVER/" \;
          ls -l "ak3/modules/vendor/lib/modules/$KVER" || true
          cat > ak3/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## Packaged by GitHub Actions

          properties() { '
          kernel.string=NetHunter SM8150 (LineageOS 23.2)
          do.devicecheck=0
          do.modules=1
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=OnePlus7
          device.name2=OnePlus7Pro
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end boot_attributes

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          patch_cmdline androidboot.force_normal_boot "androidboot.force_normal_boot=1";
          write_boot;
          EOF
          cd ak3
          zip -r9 "../NetHunter-SM8150-AK3-$(date +%Y%m%d).zip" . -x ".git/*"
          cd ..
          ls -lh NetHunter-SM8150-AK3-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: nethunter-ak3
          path: |
            NetHunter-SM8150-AK3-*.zip
            NetHunter-modules-*.zip
            out/arch/arm64/boot/Image.gz
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nethunter-sm8150-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          KVER="$(cat out/include/config/kernel.release)"
          gh release create "$TAG" \
            NetHunter-SM8150-AK3-*.zip \
            NetHunter-modules-*.zip \
            out/arch/arm64/boot/Image.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "NetHunter SM8150 (LineageOS 23.2) #${GITHUB_RUN_NUMBER}" \
            --notes "自动构建，提交 ${GITHUB_SHA:0:10}，内核 ${KVER}

          刷入：TWRP 里安装 AnyKernel3 zip（A/B 自动选当前活动槽）。
          模块：随 zip 写入 /vendor/lib/modules/${KVER}/，也可单独下载 modules zip 手动推送。
          运行记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
